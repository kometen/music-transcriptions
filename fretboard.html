<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guitar Fretboard — Natural Notes</title>
<!--
  GUITAR FRETBOARD DIAGRAM
  ========================
  Layout  : Landscape — frets run left, nut (thick bar) on the RIGHT,
            string number + open note label to the RIGHT of the nut.
  Strings : Thinnest (e, string 1) at top — conventional player's view.
  Notes   : Natural notes shown in bold. Sharps omitted (set
            SHOW_SHARPS = true below to reveal them in lighter text).
  Frets   : 12 frets shown. Dot markers at 3, 5, 7, 9, 12.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f7f3ea;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 36px 28px 28px;
    min-width: 900px;
  }

  h1 {
    text-align: center;
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 4px;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  .fretboard-wrap {
    overflow-x: auto;
  }

  table.fb {
    border-collapse: collapse;
    margin: 0 auto;
    /* Frets go left → right, nut on the right */
  }

  /* ── Fret-number header row ── */
  tr.fret-nums td {
    text-align: center;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 1px;
    padding-bottom: 8px;
    height: 18px;
  }
  tr.fret-nums td.nut-col { background: transparent; }

  /* ── Dot-marker row ── */
  tr.dots td {
    text-align: center;
    height: 14px;
    vertical-align: middle;
  }
  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ccc;
    vertical-align: middle;
  }

  /* ── String rows ── */
  tr.string-row td.fc {
    /* Each fret cell */
    width: 62px;
    height: 34px;
    border-left: 1px solid #aaa;   /* fret wire */
    text-align: center;
    vertical-align: middle;
    position: relative;
  }

  /* The string line — runs through every fret cell */
  tr.string-row td.fc::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: #b0a898;
    z-index: 0;
  }

  /* String thicknesses (string 1 = thinnest) */
  tr.s1 td.fc::before { height: 1px; }
  tr.s2 td.fc::before { height: 1px; background: #a09888; }
  tr.s3 td.fc::before { height: 2px; background: #9a9080; }
  tr.s4 td.fc::before { height: 2px; background: #907e6e; }
  tr.s5 td.fc::before { height: 3px; background: #857060; }
  tr.s6 td.fc::before { height: 3px; background: #786050; }

  /* Note label sits on top of the string line */
  .n {
    position: relative;
    z-index: 1;
    background: #f7f3ea;
    padding: 1px 5px;
    font-size: 14px;
    font-weight: bold;
    color: #1a1a1a;
    display: inline-block;
    line-height: 1.3;
  }

  /* Sharp note — shown lighter, smaller (or hidden via JS) */
  .n.sharp {
    font-size: 11px;
    font-weight: normal;
    color: #ccc;
  }

  /* ── NUT column ── */
  td.nut-col {
    width: 11px;
    background: #2a2218;
    border-left: none;
    border-right: none;
    padding: 0;
  }

  /* ── String-label column (right of nut) ── */
  td.label-col {
    padding-left: 10px;
    white-space: nowrap;
    vertical-align: middle;
  }

  .lnum {
    font-size: 10px;
    color: #aaa;
    margin-right: 5px;
    letter-spacing: 1px;
  }

  .lname {
    font-size: 16px;
    font-weight: bold;
    color: #333;
  }

  /* Extend the string line through the label cell too */
  td.label-col {
    position: relative;
  }
  /* No pseudo-element here — the visual reads fine without it */

  /* ── Bottom fret-number row ── */
  tr.fret-nums-bottom td {
    text-align: center;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 1px;
    padding-top: 8px;
    height: 18px;
  }

  .note-hint {
    text-align: center;
    margin-top: 18px;
    font-size: 11px;
    color: #bbb;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<h1>Guitar Fretboard &nbsp;·&nbsp; Natural Notes</h1>

<div class="fretboard-wrap">
  <table class="fb" id="fb"></table>
</div>

<p class="note-hint">
  String 1 (thinnest) at top &nbsp;·&nbsp; Nut at right &nbsp;·&nbsp; Frets 1–12 (left = fret 12, right = fret 1)
  &nbsp;·&nbsp; Dot markers at frets 3, 5, 7, 9, 12
</p>

<script>
// ── Configuration ────────────────────────────────────────────────────────────
const SHOW_SHARPS = false;   // set true to display # notes in faint text
const NUM_FRETS   = 12;

// ── String data (index 0 = open, index 1 = fret 1, …, index 12 = fret 12) ──
// Strings ordered thinnest (1) → thickest (6)
const STRINGS = [
  { num: 1, name: 'e', cls: 's1',
    notes: ['e','F','F#','G','G#','A','A#','B','C','C#','D','D#','e'] },
  { num: 2, name: 'B', cls: 's2',
    notes: ['B','C','C#','D','D#','E','F','F#','G','G#','A','A#','B'] },
  { num: 3, name: 'G', cls: 's3',
    notes: ['G','G#','A','A#','B','C','C#','D','D#','E','F','F#','G'] },
  { num: 4, name: 'D', cls: 's4',
    notes: ['D','D#','E','F','F#','G','G#','A','A#','B','C','C#','D'] },
  { num: 5, name: 'A', cls: 's5',
    notes: ['A','A#','B','C','C#','D','D#','E','F','F#','G','G#','A'] },
  { num: 6, name: 'E', cls: 's6',
    notes: ['E','F','F#','G','G#','A','A#','B','C','C#','D','D#','E'] },
];

// Frets that get dot markers
const DOT_FRETS = new Set([3, 5, 7, 9, 12]);

// ── Helpers ──────────────────────────────────────────────────────────────────
function td(cls, html) {
  const el = document.createElement('td');
  if (cls) el.className = cls;
  if (html !== undefined) el.innerHTML = html;
  return el;
}

function noteCell(note) {
  const isSharp = note.includes('#');
  if (isSharp && !SHOW_SHARPS) {
    // Empty cell — just the string line (::before pseudo) shows
    return td('fc');
  }
  const cls = isSharp ? 'n sharp' : 'n';
  return td('fc', `<span class="${cls}">${note}</span>`);
}

// ── Build table ──────────────────────────────────────────────────────────────
// Columns: fret 12, fret 11, …, fret 1 | NUT | label
// (Rightmost fret before the nut = fret 1; matches the original diagram style)

const table = document.getElementById('fb');

function makeNumRow(cls) {
  const tr = document.createElement('tr');
  tr.className = cls;
  // Fret number cells (fret 12 → fret 1, left to right)
  for (let f = NUM_FRETS; f >= 1; f--) {
    tr.appendChild(td('', f));
  }
  tr.appendChild(td('nut-col'));   // nut gap
  tr.appendChild(td('', ''));      // label gap
  return tr;
}

// Top fret numbers
table.appendChild(makeNumRow('fret-nums'));

// String rows
STRINGS.forEach(str => {
  const tr = document.createElement('tr');
  tr.className = `string-row ${str.cls}`;

  // Fret cells: fret 12 first (leftmost), fret 1 last (rightmost before nut)
  for (let f = NUM_FRETS; f >= 1; f--) {
    tr.appendChild(noteCell(str.notes[f]));
  }

  // Nut
  tr.appendChild(td('nut-col'));

  // String label: open note + string number
  const label = td('label-col');
  label.innerHTML =
    `<span class="lname">${str.notes[0]}</span><span class="lnum"> ${str.num}</span>`;
  tr.appendChild(label);

  table.appendChild(tr);
});

// Dot marker row
const dotRow = document.createElement('tr');
dotRow.className = 'dots';
for (let f = NUM_FRETS; f >= 1; f--) {
  const cell = td('');
  if (DOT_FRETS.has(f)) {
    if (f === 12) {
      cell.innerHTML = '<span class="dot"></span>&thinsp;<span class="dot"></span>';
    } else {
      cell.innerHTML = '<span class="dot"></span>';
    }
  }
  dotRow.appendChild(cell);
}
dotRow.appendChild(td('nut-col'));
dotRow.appendChild(td(''));
table.appendChild(dotRow);

// Bottom fret numbers
table.appendChild(makeNumRow('fret-nums-bottom'));
</script>

</body>
</html>
